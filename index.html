<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sensex & Nifty Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--text:#e2e8f0;--dim:#64748b;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--gbg:rgba(16,185,129,.1);--rbg:rgba(239,68,68,.1);--abg:rgba(245,158,11,.1)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 20px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:18px}
.hdr h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.st{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;animation:p 2s infinite}.dot.live{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.wait{background:var(--amber)}.dot.off{background:var(--red)}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.ts{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);text-align:right;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ch{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.ch.s{border-bottom:2px solid var(--blue);background:rgba(59,130,246,.04)}.ch.n{border-bottom:2px solid var(--green);background:rgba(16,185,129,.04)}
.in{font-size:18px;font-weight:800;letter-spacing:1px}.ch.s .in{color:var(--blue)}.ch.n .in{color:var(--green)}
.bp{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700}
.mr{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.mc{background:var(--card);padding:8px 10px;text-align:center}
.mc .l{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:3px}
.mc .v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);padding:8px 10px;text-align:center;border-bottom:1px solid var(--border)}
td{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;padding:8px 10px;text-align:center;border-bottom:1px solid rgba(30,41,59,.4)}
td.lb{font-family:'Inter',sans-serif;font-weight:600;text-align:left;color:var(--dim);font-size:11px;text-transform:uppercase}
.ceh{color:var(--blue)!important;font-weight:700!important}.peh{color:var(--green)!important;font-weight:700!important}
.dv{padding:10px 14px;border-top:1px solid var(--border)}.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.di{padding:8px 12px;border-radius:6px;background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.03)}.di.f{grid-column:1/-1}
.dl{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:2px}
.dd{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700}.dh{font-size:9px;color:var(--dim);margin-top:1px}
.tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tg{padding:8px 12px;border-radius:6px;text-align:center;background:var(--gbg);border:1px solid rgba(16,185,129,.15)}
.sl{padding:8px 12px;border-radius:6px;text-align:center;background:var(--rbg);border:1px solid rgba(239,68,68,.15)}
.tg .dd{color:var(--green)}.sl .dd{color:var(--red)}
.s2{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);text-align:center;margin:8px 0 4px}
.bg{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700}.bg.bu{background:var(--gbg);color:var(--green)}.bg.be{background:var(--rbg);color:var(--red)}.bg.ne{background:var(--abg);color:var(--amber)}
.cb{color:var(--blue)}.cg{color:var(--green)}.cr{color:var(--red)}
.ld{text-align:center;padding:80px 20px;color:var(--dim);grid-column:1/-1}.ld h2{margin-bottom:8px}
</style></head><body>
<div class="hdr"><h1>SENSEX & NIFTY LIVE</h1><div class="st"><div class="dot wait" id="dot"></div><span id="sT">Connecting...</span><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)" id="cd"></span></div></div>
<div class="ts" id="ts"></div>
<div class="grid" id="app"><div class="ld"><h2>Connecting to data feed...</h2><p>Loading market data...</p></div></div>
<script>
const API="https://gist.githubusercontent.com/DeveshChhedda/585688da34c83cfcee1376a01e97837d/raw/data.json";
const R=5000;let t=R/1000;
function fm(n,d=2){if(n==null)return"—";return Number(n).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d})}
function fi(n){if(n==null)return"—";return Number(n).toLocaleString("en-IN")}
function pb(p){if(p>1)return'<span class="bg bu">BULLISH</span>';if(p<.7)return'<span class="bg be">BEARISH</span>';return'<span class="bg ne">NEUTRAL</span>'}
function rc(d,tp){const h=tp==="s"?"s":"n",fp=d.fut_premium>=0?"cg":"cr";
return`<div class="card"><div class="ch ${h}"><span class="in">${d.index}</span><span class="bp">${fm(d.fut_price)}</span></div><div class="mr"><div class="mc"><div class="l">Fut Symbol</div><div class="v" style="font-size:10px">${d.fut_symbol||"—"}</div></div><div class="mc"><div class="l">ATM Strike</div><div class="v">${fm(d.strike,0)}</div></div><div class="mc"><div class="l">Expiry</div><div class="v" style="font-size:11px">${d.expiry}</div></div><div class="mc"><div class="l">PCR</div><div class="v">${d.pcr} ${pb(d.pcr)}</div></div></div><table><tr><th></th><th class="ceh" colspan="3">CALL (CE)</th><th class="peh" colspan="3">PUT (PE)</th></tr><tr><th></th><th>LTP</th><th>OI</th><th>Vol</th><th>LTP</th><th>OI</th><th>Vol</th></tr><tr><td class="lb">Symbol</td><td colspan="3" style="font-size:10px">${d.ce_symbol}</td><td colspan="3" style="font-size:10px">${d.pe_symbol}</td></tr><tr><td class="lb">Live</td><td>${fm(d.ce_ltp)}</td><td>${fi(d.ce_oi)}</td><td>${fi(d.ce_vol)}</td><td>${fm(d.pe_ltp)}</td><td>${fi(d.pe_oi)}</td><td>${fi(d.pe_vol)}</td></tr></table><div class="dv"><div class="dg"><div class="di"><div class="dl">Jodi Price</div><div class="dd cb">${fm(d.jodi)}</div><div class="dh">CE + PE LTP</div></div><div class="di"><div class="dl">Synthetic Future</div><div class="dd">${fm(d.synthetic_future)}</div><div class="dh">Strike + CE − PE</div></div><div class="di f"><div class="dl">Futures Premium</div><div class="dd ${fp}">${fm(d.fut_premium)}</div><div class="dh">Future − Synthetic</div></div></div><div class="s2">Target</div><div class="tr"><div class="tg"><div class="dl">Call Target</div><div class="dd">${fm(d.call_target)}</div><div class="dh">PE OI / Total OI × Jodi</div></div><div class="tg"><div class="dl">Put Target</div><div class="dd">${fm(d.put_target)}</div><div class="dh">CE OI / Total OI × Jodi</div></div></div><div class="s2">Stop Loss</div><div class="tr"><div class="sl"><div class="dl">Call SL</div><div class="dd">${fm(d.call_sl)}</div><div class="dh">CE + (CE − Target)</div></div><div class="sl"><div class="dl">Put SL</div><div class="dd">${fm(d.put_sl)}</div><div class="dh">PE − (Target − PE)</div></div></div></div></div>`}
async function fd(){try{const r=await fetch(API+"?t="+Date.now());const d=await r.json();
if(d.status==="live"&&d.sensex&&d.nifty){document.getElementById("app").innerHTML=rc(d.sensex,"s")+rc(d.nifty,"n");document.getElementById("sT").textContent="LIVE";document.getElementById("ts").textContent=d.timestamp;document.getElementById("dot").className="dot live"}
else{document.getElementById("sT").textContent=d.status||"Waiting...";document.getElementById("dot").className="dot wait"}}
catch(e){document.getElementById("sT").textContent="Offline";document.getElementById("dot").className="dot off"}t=R/1000}
setInterval(()=>{t--;if(t<=0)t=R/1000;document.getElementById("cd").textContent=t+"s"},1000);fd();setInterval(fd,R);
</script></body></html>
